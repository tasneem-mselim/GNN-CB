<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GNN Coding Benchmark</title>
    <style>
        body { margin: 0; font-family: "Segoe UI", sans-serif; background: #f4fff6; color: #111; scroll-behavior: smooth; }
        nav { position: sticky; top: 0; background: white; padding: 12px 30px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; z-index: 100; }
        nav a { margin-left: 20px; text-decoration: none; color: #2d6a4f; font-weight: 600; }
        header { text-align: center; padding: 50px 20px; }
        .section { width: 95%; max-width: 1400px; margin: 40px auto; }
        h2 { border-bottom: 2px solid #cde8d0; padding-bottom: 10px; color: #1b4332; }
        
        /* FILTERS */
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; background: white; padding: 15px; border-radius: 8px; border: 1px solid #d8f3dc; }
        input, select { padding: 10px; border: 1px solid #ccc; border-radius: 5px; flex-grow: 1; min-width: 150px; }

        /* CARDS */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; border: 1px solid #d8f3dc; transition: 0.3s; display: flex; flex-direction: column; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-color: #2d6a4f; }
        .card h3 { margin: 0 0 10px 0; color: #2d6a4f; font-size: 1.2em; }
        .card p.desc { font-size: 0.85em; color: #444; margin-bottom: 15px; line-height: 1.4; flex-grow: 1; }
        
        .meta-info { font-size: 0.75em; color: #666; margin-bottom: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .meta-info span b { color: #1b4332; }

        .tag-row { display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap; }
        .tag { font-size: 0.7em; padding: 3px 8px; border-radius: 12px; background: #e9ecef; font-weight: bold; text-transform: uppercase; }
        .tag.Easy { background: #d8f3dc; color: #2d6a4f; }
        .tag.Med { background: #fff3b0; color: #997b00; }
        .tag.Hard { background: #ffd7ba; color: #d9480f; }
        .tag.Expert { background: #f8ad9d; color: #a4161a; }
        .tag.Type { background: #e0f2fe; color: #0369a1; }

        .card-links { display: flex; gap: 8px; border-top: 1px solid #eee; padding-top: 15px; }
        .card-links a { font-size: 0.75em; text-decoration: none; color: #2d6a4f; font-weight: bold; padding: 6px; border: 1px solid #2d6a4f; border-radius: 4px; transition: 0.2s; flex: 1; text-align: center; }
        .card-links a:hover { background: #2d6a4f; color: white; }

        /* TABLE */
        .table-container { overflow-x: auto; background: white; border-radius: 8px; border: 1px solid #ddd; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #2d6a4f; color: white; cursor: pointer; white-space: nowrap; }
        tr:hover { background: #f1f8e9; }

        footer { text-align: center; padding: 40px; color: #666; font-size: 0.9em; }
    </style>
</head>
<body>

<nav>
    <div><b>GNN-CB</b></div>
    <div>
        <a href="#tasks">Competitions</a>
        <a href="#leaderboard">Leaderboard</a>
    </div>
</nav>

<header>
    <h1>GNN Coding Benchmark</h1>
    <p>Comprehensive overview of 18 GNN competitions and human performance baselines.</p>
</header>

<div class="section" id="tasks">
    <h2>🧠 Competition Explorer</h2>
    
    <div class="controls">
        <input type="text" id="search" placeholder="Search by name, domain, or dataset..." onkeyup="filter()">
        
        <select id="diff" onchange="filter()">
            <option value="all">All Difficulties</option>
            <option value="Easy">Easy</option>
            <option value="Med">Medium</option>
            <option value="Hard">Hard</option>
            <option value="Expert">Expert</option>
        </select>

        <select id="typeFilter" onchange="filter()">
            <option value="all">All Categories</option>
            <option value="Homo">Homogeneous</option>
            <option value="Hetero">Heterogeneous</option>
            <option value="Spatial">Spatial</option>
            <option value="Temp">Temporal</option>
            <option value="Hier">Hierarchical</option>
            <option value="Gen">Generative</option>
            <option value="Molecular">Molecular</option>
        </select>
    </div>

    <div class="grid" id="grid"></div>
</div>

<div class="section" id="leaderboard">
    <h2>🏆 Human Leaderboard</h2>
    <div class="table-container">
        <table id="mainTable">
            <thead>
                <tr>
                    <th onclick="sortTable(0)">#</th>
                    <th onclick="sortTable(1)">Competition</th>
                    <th onclick="sortTable(2)">Diff.</th>
                    <th onclick="sortTable(3)">N</th>
                    <th onclick="sortTable(4)">AVG</th>
                    <th onclick="sortTable(5)">STD</th>
                    <th onclick="sortTable(6)">High</th>
                    <th onclick="sortTable(7)">Low</th>
                    <th onclick="sortTable(8)">Median</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
</div>

<footer>Basira Lab • GNN Benchmark 2026</footer>

    { id: "C06", name: "DiaGraph", diff: "Hard", cat: "Homo", nodes: "96.1K", edges: "1224K", feat: "12", domain: "Medical", metric: "Macro-F1", dataset: "Kaggle Diabetes", desc: "Binary node classification for diabetes prediction on a noisy patient similarity graph", repo: "#", n_human: 15, avg: 0.5703, std: 0.1254, high: 0.8224, low: 0.4769, med: 0.5011, l_url: "#" },

    { id: "C18", name: "The THInC Challenge", diff: "Hard", cat: "Spatial", nodes: "30", edges: "148", feat: "4", domain: "Biomedical", metric: "Macro-F1", dataset: "NuCLS", desc: "Inductive GNN for cell type classification", repo: "https://github.com/emmakowu3579-ui/inductive-class-challenge", n_human: 14, avg: 0.4895, std: 0.0562, high: 0.5652, low: 0.3543, med: 0.4981, l_url: "https://emmakowu3579-ui.github.io/inductive-class-challenge/leaderboard.html" }
];

function init() {
    const grid = document.getElementById('grid');
    const tableBody = document.getElementById('table-body');
    
    competitions.forEach(comp => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.name = (comp.name + comp.domain + comp.dataset).toLowerCase();
        card.dataset.diff = comp.diff;
        card.dataset.cat = comp.cat;
        card.innerHTML = `
            <div class="tag-row">
                <span class="tag ${comp.diff}">${comp.diff}</span>
                <span class="tag Type">${comp.cat}</span>
            </div>
            <h3>${comp.name}</h3>
            <p class="desc">${comp.desc}</p>
            <div class="meta-info">
                <span><b>Nodes:</b> ${comp.nodes}</span>
                <span><b>Edges:</b> ${comp.edges}</span>
                <span><b>Metric:</b> ${comp.metric}</span>
                <span><b>Domain:</b> ${comp.domain}</span>
            </div>
            <div class="meta-info" style="margin-top:-10px;">
                <span style="grid-column: span 2;"><b>Dataset:</b> ${comp.dataset}</span>
            </div>
            <div class="card-links">
                <a href="${comp.repo}" target="_blank">Repository</a>
                <a href="${comp.l_url}" target="_blank">Leaderboard</a>
            </div>
        `;
        grid.appendChild(card);

        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${comp.id}</td>
            <td><b>${comp.name}</b></td>
            <td><span class="tag ${comp.diff}">${comp.diff}</span></td>
            <td>${comp.n_human}</td>
            <td>${comp.avg}</td>
            <td>${comp.std}</td>
            <td>${comp.high}</td>
            <td>${comp.low}</td>
            <td>${comp.med}</td>
        `;
        tableBody.appendChild(row);
    });
}

function filter() {
    const text = document.getElementById('search').value.toLowerCase();
    const difficulty = document.getElementById('diff').value;
    const cat = document.getElementById('typeFilter').value;
    
    document.querySelectorAll('.card').forEach(card => {
        const matchesText = card.dataset.name.includes(text);
        const matchesDiff = difficulty === 'all' || card.dataset.diff === difficulty;
        const matchesCat = cat === 'all' || card.dataset.cat === cat;
        card.style.display = (matchesText && matchesDiff && matchesCat) ? 'flex' : 'none';
    });
}

function sortTable(n) {
    const table = document.getElementById("mainTable");
    let rows = Array.from(table.rows).slice(1);
    let isAsc = table.dataset.sortOrder === 'asc';
    
    rows.sort((a, b) => {
        let valA = a.cells[n].innerText;
        let valB = b.cells[n].innerText;
        if(!isNaN(parseFloat(valA.replace(/[%,~,K]/g, '')))) {
            return isAsc ? parseFloat(valA) - parseFloat(valB) : parseFloat(valB) - parseFloat(valA);
        }
        return isAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
    });

    rows.forEach(r => table.tBodies[0].appendChild(r));
    table.dataset.sortOrder = isAsc ? 'desc' : 'asc';
}

init();
</script>
</body>
</html>
